# ==================== 生产环境：MySQL ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskdb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123456
  h2:
    console:
      enabled: false
  flyway:
    locations: classpath:db/migration/mysql

# AI 生产配置 —— 阿里云百炼（OpenAI 兼容接口）
ai:
  provider: openai
  openai:
    api-key: ${DASHSCOPE_API_KEY}                                         # 从环境变量读取
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1           # 含版本路径
    model: qwen3.7-flash                                                  # 千问最新闪推模型
