# ============================================================
# Phase 8.2 一键部署：backend + MySQL + Qdrant + MinIO
# 启动：docker compose up --build -d
# 停止：docker compose down          （加 -v 会清空数据卷）
# 敏感配置通过 .env 注入（参考 .env.example），.env 不入 Git
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: ai-app-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-app-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-app-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-app-backend
    restart: unless-stopped
    environment:
      # profile：prod = MySQL + 多模态/LLM；可被下方 AI_PROVIDER 覆盖回 mock
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-taskdb}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-appuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-apppassword}

      # 业务外置配置
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-secret-2024!!}
      AI_PROVIDER: ${AI_PROVIDER:-mock}              # 有 Key 时可改 openai
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}

      # 向量存储（Qdrant 走容器内 service name）
      QDRANT_HOST: qdrant

      # 文件存储切 MinIO（容器内 service name）
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # JRE 镜像无 curl/wget，用 bash /dev/tcp 探测 8080 端口就绪；
      # 真正的 Actuator /actuator/health 由宿主机/探活脚本访问
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  mysql_data:
  qdrant_data:
  minio_data:
  backend_uploads:
